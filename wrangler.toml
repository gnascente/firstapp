name = "firstapp"
compatibility_date = "2023-10-30"
main = "src/index.ts"

[assets]
directory = "public"

[observability.logs]
enabled = true
invocation_logs = true
persist = true

[[d1_databases]]
binding = "DB"
database_name = "firstapp-db"
database_id = "default" # The user wants to create one via Wrangler or let Wrangler create it locally during dev.

[[r2_buckets]]
binding = "MY_BUCKET"
bucket_name = "mystorage"
